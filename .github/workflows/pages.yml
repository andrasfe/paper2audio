name: Deploy player to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/figures
          cp player/index.html player/sw.js player/manifest.webmanifest player/icon.png _site/
          cp examples/quantum_finance/site.json _site/
          cp -r examples/quantum_finance/audio _site/audio
          cp -r examples/quantum_finance/figures/img _site/figures/img
          cp -r examples/quantum_finance/figures/audio _site/figures/audio
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
