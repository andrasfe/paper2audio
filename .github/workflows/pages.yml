name: Deploy player to GitHub Pages

# Deploys by pushing the assembled site to the gh-pages branch, which
# GitHub Pages serves. (The Pages REST API deploy path requires a token
# permission this repository's workflow token does not have.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/figures
          cp player/index.html player/sw.js player/manifest.webmanifest player/icon.png _site/
          cp examples/byzantine_fl/site.json _site/
          cp -r examples/byzantine_fl/audio _site/audio
          cp -r examples/byzantine_fl/figures/img _site/figures/img
          cp -r examples/byzantine_fl/figures/audio _site/figures/audio
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            gh-pages
