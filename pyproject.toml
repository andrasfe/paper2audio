[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2audio"
version = "0.2.0"
description = "Turn a research paper (PDF or LaTeX) into a long-form spoken audio explanation for non-expert listeners"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pypdf>=4.0",
    "espeakng-loader>=0.2",
    "lameenc>=1.6",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
neural = ["piper-tts>=1.4", "joe-us-piper-voice"]

[project.scripts]
paper2audio = "paper2audio.cli:main"

[tool.setuptools.packages.find]
include = ["paper2audio*"]
